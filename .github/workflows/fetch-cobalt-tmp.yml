name: fetch-cobalt-tmp

# TEMPORARY relay workflow.
# The dev sandbox has no network route to gitlab.com, so this one-shot job
# downloads the official Cobalt release bundle on a GitHub-hosted runner
# (which does have full internet access) and commits it back to this branch.
# It is deleted again as soon as the file has been retrieved.

on:
  push:
    branches:
      - arena/01a0aa30-cobalt-optimized
    paths:
      - .github/workflows/fetch-cobalt-tmp.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0aa30-cobalt-optimized

      - name: Download Cobalt.luau from GitLab
        run: |
          set -euo pipefail
          mkdir -p .cobalt-tmp
          curl -sSL --fail --retry 3 --retry-delay 5 \
            -o .cobalt-tmp/Cobalt.luau \
            "https://gitlab.com/upio/cobalt/-/releases/permalink/latest/downloads/Cobalt.luau"
          echo "--- downloaded ---"
          ls -l .cobalt-tmp/Cobalt.luau
          sha256sum .cobalt-tmp/Cobalt.luau

      - name: Commit it back
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .cobalt-tmp/Cobalt.luau
          git commit -m "tmp: download Cobalt.luau release bundle [skip ci]"
          git push
